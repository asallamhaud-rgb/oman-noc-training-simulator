<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oman NOC Simulator OS v4.2</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;600&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }
    .font-heading {
      font-family: 'Cinzel', serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .liquid-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .liquid-glass-strong {
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen relative antialiased selection:bg-white/20">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_NODES = [
      { id: 'MUS-CR-01', name: 'Muscat Core Router 01', type: 'Core Router', site: 'Muscat HQ', ip: '10.100.1.1', status: 'Operational', x: 280, y: 110 },
      { id: 'SAL-CR-01', name: 'Salalah Core Node', type: 'Core Router', site: 'Salalah Port', ip: '10.100.1.5', status: 'Critical', x: 230, y: 390 },
      { id: 'SOH-CR-02', name: 'Sohar Gateway Edge', type: 'Aggregation Switch', site: 'Sohar Freezone', ip: '10.100.2.12', status: 'Major', x: 130, y: 170 },
      { id: 'NZW-AGG-SW03', name: 'Nizwa Regional Switch', type: 'Aggregation Switch', site: 'Nizwa City', ip: '10.100.3.30', status: 'Warning', x: 350, y: 220 },
      { id: 'SUR-VSAT-01', name: 'Sur Maritime Gateway', type: 'VSAT Hub', site: 'Sur Terminal', ip: '10.100.4.88', status: 'Operational', x: 450, y: 270 },
    ];

    const INITIAL_ALARMS = [
      { id: 'ALM-9901', severity: 'Emergency', device: 'SAL-CR-01', site: 'Salalah Port', message: 'DWDM Optical LOS - Fiber Cut Km 142 (Adam Corridor)', timestamp: '16:02:11', status: 'Active' },
      { id: 'ALM-9902', severity: 'Critical', device: 'SOH-CR-02', site: 'Sohar Freezone', message: 'ASIC Hardware Memory Parity Error on Port Hu0/3/0/1', timestamp: '16:04:45', status: 'Active' },
      { id: 'ALM-9903', severity: 'Major', device: 'NZW-AGG-SW03', site: 'Nizwa City', message: 'Spanning Tree MAC Flapping Loop on Port Gi1/0/25', timestamp: '16:05:00', status: 'Active' },
      { id: 'ALM-9904', severity: 'Minor', device: 'MUS-CR-01', site: 'Muscat HQ', message: 'High CPU Temperature Threshold Exceeded (78°C)', timestamp: '16:05:30', status: 'Active' },
    ];

    const INITIAL_TICKETS = [
      { id: 'INC-88301', title: 'Salalah Terrestrial Fiber Cut (Adam Corridor)', severity: 'Emergency', status: 'New', sourceAlarmId: 'ALM-9901', device: 'SAL-CR-01', site: 'Salalah Port', slaRemainingSec: 290, description: '120Gbps primary DWDM backbone severed. Traffic failing over to saturated microwave path.', department: 'Transmission & Fiber' },
      { id: 'INC-88302', title: 'Sohar Core Line Card Parity Errors', severity: 'Critical', status: 'Acknowledged', sourceAlarmId: 'ALM-9902', device: 'SOH-CR-02', site: 'Sohar Freezone', slaRemainingSec: 840, description: 'Uncorrectable ECC memory error on 400GbE line card. CRC error rate exceeding 15% threshold.', department: 'IP Core Engineering' },
      { id: 'INC-88303', title: 'Nizwa L2 Loop & Cell Outage', severity: 'Major', status: 'In Progress', sourceAlarmId: 'ALM-9903', device: 'NZW-AGG-SW03', site: 'Nizwa City', slaRemainingSec: 1400, description: 'Broadcast storm across VLAN 120. 12 gNodeB cells offline.', department: 'Field Maintenance' },
    ];

    const ENGINEERS = [
      { id: 'ENG-008', name: 'Salim Al-Harthy', region: 'Nizwa / Adam', skills: ['DWDM Splicing', 'OTDR Trace'], workloadPercent: 20, etaMinutes: 22, status: 'Available', slaComplianceRate: 98 },
      { id: 'ENG-012', name: 'Ahmed Al-Riyami', region: 'Sohar Industrial', skills: ['Cisco Hardware Swap', 'BGP Route Draining'], workloadPercent: 45, etaMinutes: 15, status: 'Available', slaComplianceRate: 94 },
      { id: 'ENG-019', name: 'Tariq Al-Busaidi', region: 'Muscat HQ', skills: ['5G Core Routing', 'MPLS Traffic Eng'], workloadPercent: 85, etaMinutes: 50, status: 'On Site', slaComplianceRate: 91 },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [alarms, setAlarms] = useState(INITIAL_ALARMS);
      const [tickets, setTickets] = useState(INITIAL_TICKETS);
      const [nodes, setNodes] = useState(INITIAL_NODES);
      const [selectedTicket, setSelectedTicket] = useState(INITIAL_TICKETS[0]);
      const [selectedNode, setSelectedNode] = useState(null);
      const [isManualOpen, setIsManualOpen] = useState(false);
      const [kpiScore, setKpiScore] = useState(94);
      const [timer, setTimer] = useState(290);

      const [cliLogs, setCliLogs] = useState([
        'OMAN NOC SIMULATOR OS v4.2 [SULTANATE TELECOM BACKBONE]',
        'Connected to Core Management Plane...',
        'System status: 4 Active Correlated Alarms.'
      ]);
      const [cliInput, setCliInput] = useState('');

      useEffect(() => {
        const interval = setInterval(() => {
          setTimer(prev => Math.max(0, prev - 1));
          setTickets(prev => prev.map(t => ({
            ...t,
            slaRemainingSec: t.status === 'Resolved' ? t.slaRemainingSec : Math.max(0, t.slaRemainingSec - 1)
          })));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      const formatSLA = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleCliSubmit = (e) => {
        e.preventDefault();
        if (!cliInput.trim()) return;
        const cmd = cliInput.trim().toLowerCase();
        const logs = [...cliLogs, `OMAN-NOC# ${cliInput}`];

        if (cmd.includes('shutdown gi1/0/25') || cmd.includes('bpduguard')) {
          logs.push('✓ Interface Gi1/0/25 shutdown. STP loop cleared on NZW-AGG-SW03.');
          setAlarms(prev => prev.map(a => a.device === 'NZW-AGG-SW03' ? { ...a, status: 'Cleared' } : a));
          setTickets(prev => prev.map(t => t.id === 'INC-88303' ? { ...t, status: 'Resolved' } : t));
          setKpiScore(prev => Math.min(100, prev + 5));
        } else if (cmd.includes('autoroute') || cmd.includes('mpls')) {
          logs.push('✓ Traffic rerouted via Subsea standby path. Adam corridor clear.');
          setKpiScore(prev => Math.min(100, prev + 5));
        } else {
          logs.push(`Command executed: "${cliInput}".`);
        }
        setCliLogs(logs);
        setCliInput('');
      };

      const handleResolve = (id) => {
        setTickets(prev => prev.map(t => t.id === id ? { ...t, status: 'Resolved' } : t));
      };

      return (
        <div className="pb-16">
          {/* BACKGROUND DECORATION */}
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            <div className="absolute top-[-10%] left-[20%] w-[600px] h-[600px] bg-blue-950/20 rounded-full blur-[140px]"></div>
            <div className="absolute bottom-[-10%] right-[15%] w-[700px] h-[700px] bg-red-950/20 rounded-full blur-[160px]"></div>
          </div>

          {/* NAVBAR */}
          <nav className="fixed top-4 left-4 right-4 z-50 liquid-glass-strong rounded-full px-6 py-3 flex items-center justify-between border border-white/10 shadow-2xl">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-heading italic font-bold text-xl text-white border border-white/20">N</div>
              <div>
                <span className="font-heading italic text-xl tracking-wider text-white">OMAN NOC</span>
                <span className="hidden sm:inline-block text-[10px] ml-2 text-white/50 uppercase tracking-widest font-mono">v4.2</span>
              </div>
            </div>

            <div className="hidden lg:flex items-center gap-1 bg-white/5 p-1 rounded-full border border-white/5">
              {['dashboard', 'alarms', 'tickets', 'topology', 'fm', 'config'].map(tab => (
                <button
                  key={tab}
                  onClick={() => setActiveTab(tab)}
                  className={`px-4 py-1.5 rounded-full text-xs uppercase tracking-wider transition-all font-medium ${
                    activeTab === tab ? 'bg-white text-black font-semibold shadow-lg' : 'text-white/70 hover:text-white'
                  }`}
                >
                  {tab === 'fm' ? 'FM Optimizer' : tab === 'config' ? 'CLI Terminal' : tab}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-4">
              <div className="text-right hidden sm:block border-r border-white/10 pr-4">
                <div className="text-[9px] uppercase tracking-widest text-white/40">KPI Score</div>
                <div className="font-heading text-lg italic text-emerald-400 font-bold">{kpiScore} / 100</div>
              </div>
              <button onClick={() => setIsManualOpen(true)} className="px-3.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-xs border border-white/20">
                <i className="fa-solid fa-book mr-1.5"></i> Manual
              </button>
            </div>
          </nav>

          {/* MAIN CONTAINER */}
          <main className="relative z-10 pt-28 px-4 max-w-7xl mx-auto space-y-8">

            {/* DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                <div className="space-y-2">
                  <h1 className="font-heading italic text-5xl md:text-7xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-b from-white to-white/40">
                    Monitor. Investigate. Resolve.
                  </h1>
                  <p className="text-white/60 text-sm md:text-base max-w-2xl font-light">
                    Real-time telecommunications NOC training platform modeling fault propagation across Omani core fiber & 5G backhaul.
                  </p>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="liquid-glass p-5 rounded-3xl border border-white/10 space-y-1">
                    <div className="flex justify-between text-white/50 text-xs uppercase"><span>Active Alarms</span> <i className="fa-solid fa-triangle-exclamation text-amber-400"></i></div>
                    <div className="font-heading italic text-4xl font-bold">{alarms.filter(a => a.status === 'Active').length}</div>
                    <div className="text-[11px] text-red-400">1 Emergency / 1 Critical</div>
                  </div>
                  <div className="liquid-glass p-5 rounded-3xl border border-white/10 space-y-1">
                    <div className="flex justify-between text-white/50 text-xs uppercase"><span>Open Tickets</span> <i className="fa-solid fa-chart-line text-blue-400"></i></div>
                    <div className="font-heading italic text-4xl font-bold">{tickets.filter(t => t.status !== 'Resolved').length}</div>
                    <div className="text-[11px] text-emerald-400">1 In Progress</div>
                  </div>
                  <div className="liquid-glass p-5 rounded-3xl border border-white/10 space-y-1">
                    <div className="flex justify-between text-white/50 text-xs uppercase"><span>SLA At Risk</span> <i className="fa-solid fa-clock text-red-400"></i></div>
                    <div className="font-heading italic text-4xl font-bold text-red-400">{tickets.filter(t => t.slaRemainingSec < 300 && t.status !== 'Resolved').length}</div>
                    <div className="text-[11px] text-white/40">Under 5m SLA target</div>
                  </div>
                  <div className="liquid-glass p-5 rounded-3xl border border-white/10 space-y-1">
                    <div className="flex justify-between text-white/50 text-xs uppercase"><span>Engineers Ready</span> <i className="fa-solid fa-user-gear text-emerald-400"></i></div>
                    <div className="font-heading italic text-4xl font-bold">{ENGINEERS.filter(e => e.status === 'Available').length}</div>
                    <div className="text-[11px] text-white/40">Nizwa & Sohar Sectors</div>
                  </div>
                </div>

                {/* CRITICAL BANNER */}
                <div className="liquid-glass-strong p-6 md:p-8 rounded-3xl border border-red-500/30 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 shadow-2xl">
                  <div className="space-y-2">
                    <div className="flex items-center gap-2 text-red-400 text-xs font-semibold uppercase tracking-widest">
                      <i className="fa-solid fa-shield-halved animate-pulse"></i>
                      <span>5-Minute Response Challenge</span>
                    </div>
                    <h3 className="font-heading italic text-3xl md:text-4xl font-bold">INC-88301: Salalah Fiber Cut (Adam Corridor)</h3>
                    <p className="text-white/70 text-sm max-w-xl font-light">Primary 120Gbps terrestrial backbone cut near Km 142. Microwave backup saturated.</p>
                  </div>
                  <div className="flex items-center gap-6">
                    <div className="text-center">
                      <div className="text-[10px] uppercase text-white/40">SLA Countdown</div>
                      <div className="font-heading text-4xl font-bold text-red-400">{formatSLA(timer)}</div>
                    </div>
                    <button onClick={() => setActiveTab('tickets')} className="px-6 py-3.5 rounded-full bg-red-500 hover:bg-red-600 text-white font-medium text-xs uppercase tracking-wider">
                      Investigate <i className="fa-solid fa-arrow-up-right-from-square ml-1"></i>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ALARMS TAB */}
            {activeTab === 'alarms' && (
              <div className="space-y-6">
                <h2 className="font-heading italic text-4xl">Network Alarm Stream</h2>
                <div className="liquid-glass rounded-3xl border border-white/10 overflow-hidden">
                  <table className="w-full text-left text-sm text-white/80">
                    <thead className="bg-white/5 text-xs uppercase text-white/40 border-b border-white/10">
                      <tr>
                        <th className="p-4">ID</th>
                        <th className="p-4">Severity</th>
                        <th className="p-4">Device</th>
                        <th className="p-4">Site</th>
                        <th className="p-4">Message</th>
                        <th className="p-4">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-white/5">
                      {alarms.map(a => (
                        <tr key={a.id} className="hover:bg-white/5">
                          <td className="p-4 font-mono text-xs text-white/60">{a.id}</td>
                          <td className="p-4"><span className="px-2 py-1 rounded-full text-[10px] uppercase bg-red-500/20 text-red-400 border border-red-500/30">{a.severity}</span></td>
                          <td className="p-4 font-medium">{a.device}</td>
                          <td className="p-4 text-white/60">{a.site}</td>
                          <td className="p-4">{a.message}</td>
                          <td className="p-4 text-amber-400">● {a.status}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TICKETS TAB */}
            {activeTab === 'tickets' && (
              <div className="space-y-6">
                <h2 className="font-heading italic text-4xl">Service Incident Center (SMA)</h2>
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="space-y-3">
                    {tickets.map(t => (
                      <div key={t.id} onClick={() => setSelectedTicket(t)} className={`liquid-glass p-5 rounded-3xl border cursor-pointer ${selectedTicket?.id === t.id ? 'border-white bg-white/10' : 'border-white/10'}`}>
                        <div className="flex justify-between text-xs text-white/50 mb-2">
                          <span className="font-mono">{t.id}</span>
                          <span className="text-red-400 font-mono font-bold">SLA: {formatSLA(t.slaRemainingSec)}</span>
                        </div>
                        <h4 className="font-medium text-sm text-white mb-2">{t.title}</h4>
                        <div className="flex justify-between text-xs text-white/60">
                          <span>{t.site}</span>
                          <span className="px-2 py-0.5 rounded bg-white/10 text-[10px]">{t.status}</span>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div className="lg:col-span-2">
                    {selectedTicket && (
                      <div className="liquid-glass p-6 rounded-3xl border border-white/10 space-y-6">
                        <div className="border-b border-white/10 pb-4">
                          <span className="text-xs font-mono text-white/40">{selectedTicket.id}</span>
                          <h3 className="font-heading italic text-3xl font-bold">{selectedTicket.title}</h3>
                        </div>
                        <p className="text-sm text-white/80">{selectedTicket.description}</p>
                        <div className="flex gap-3 pt-4 border-t border-white/10">
                          <button onClick={() => handleResolve(selectedTicket.id)} className="px-5 py-2.5 rounded-full bg-emerald-500 text-white text-xs font-semibold">
                            Resolve Ticket
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TOPOLOGY TAB */}
            {activeTab === 'topology' && (
              <div className="space-y-6">
                <h2 className="font-heading italic text-4xl">Core Network Topology</h2>
                <div className="liquid-glass rounded-3xl border border-white/10 p-6 relative h-[450px] overflow-hidden">
                  <svg className="absolute inset-0 w-full h-full stroke-white/20" strokeWidth="2">
                    <line x1="280" y1="110" x2="230" y2="390" strokeDasharray="4 4" className="stroke-red-500" strokeWidth="3" />
                    <line x1="280" y1="110" x2="130" y2="170" />
                    <line x1="280" y1="110" x2="350" y2="220" />
                  </svg>
                  {nodes.map(n => (
                    <div key={n.id} style={{ left: `${n.x}px`, top: `${n.y}px` }} onClick={() => setSelectedNode(n)} className="absolute transform -translate-x-1/2 -translate-y-1/2 cursor-pointer text-center">
                      <div className={`w-12 h-12 rounded-full flex items-center justify-center border-2 ${n.status === 'Critical' ? 'bg-red-500/30 border-red-500 animate-pulse' : 'bg-emerald-500/20 border-emerald-400'}`}>
                        <i className="fa-solid fa-server text-white"></i>
                      </div>
                      <div className="mt-1 text-[11px] font-semibold bg-black/80 px-2 py-0.5 rounded border border-white/10">{n.name}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* FM OPTIMIZER TAB */}
            {activeTab === 'fm' && (
              <div className="space-y-6">
                <h2 className="font-heading italic text-4xl">Field Maintenance Optimizer</h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {ENGINEERS.map(e => (
                    <div key={e.id} className="liquid-glass p-6 rounded-3xl border border-white/10 space-y-4">
                      <div>
                        <span className="text-[10px] font-mono text-white/40">{e.id}</span>
                        <h4 className="font-heading italic text-2xl font-bold">{e.name}</h4>
                        <span className="text-xs text-white/60">{e.region}</span>
                      </div>
                      <div className="text-xs space-y-1 text-white/70">
                        <div>ETA: <span className="text-white font-mono">{e.etaMinutes} mins</span></div>
                        <div>SLA Rate: <span className="text-emerald-400 font-mono">{e.slaComplianceRate}%</span></div>
                      </div>
                      <button onClick={() => alert(`Assigned work order to ${e.name}`)} className="w-full py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold">
                        Dispatch Engineer
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CLI TAB */}
            {activeTab === 'config' && (
              <div className="space-y-6">
                <h2 className="font-heading italic text-4xl">Interactive Terminal CLI</h2>
                <div className="liquid-glass p-6 rounded-3xl border border-white/10 bg-black/95 font-mono text-xs space-y-4">
                  <div className="h-64 overflow-y-auto space-y-1 text-emerald-400">
                    {cliLogs.map((l, i) => <div key={i}>{l}</div>)}
                  </div>
                  <form onSubmit={handleCliSubmit} className="flex gap-2 border-t border-white/10 pt-4">
                    <span className="text-white/40 font-bold">OMAN-NOC#</span>
                    <input
                      type="text"
                      value={cliInput}
                      onChange={e => setCliInput(e.target.value)}
                      placeholder="e.g. interface GigabitEthernet1/0/25 shutdown"
                      className="flex-1 bg-transparent text-white outline-none font-mono"
                    />
                    <button type="submit" className="px-4 py-1.5 rounded bg-white/10 text-white">Run</button>
                  </form>
                </div>
              </div>
            )}

          </main>

          {/* KNOWLEDGE BASE MODAL */}
          {isManualOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-end">
              <div className="w-full max-w-md bg-black/90 border-l border-white/10 p-6 space-y-6 overflow-y-auto">
                <div className="flex justify-between items-center border-b border-white/10 pb-4">
                  <h3 className="font-heading italic text-2xl font-bold">NOC Manual</h3>
                  <button onClick={() => setIsManualOpen(false)} className="text-white/60 hover:text-white"><i className="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div className="text-xs text-white/80 space-y-4">
                  <p><strong>Spanning Tree Loop:</strong> Run <code className="text-amber-400">shutdown gi1/0/25</code> in Terminal CLI to clear loops.</p>
                  <p><strong>Fiber Cut:</strong> Reroute traffic via MPLS secondary tunnel using <code className="text-amber-400">autoroute announce</code>.</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
