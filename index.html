<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telecom Operations & Training Simulator</title>
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div id="sidebar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#63b3ed" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span>NOC Simulator</span>
    </div>
    <div class="nav-scroll">
      <div class="nav-group-title">Monitoring</div>
      <a class="nav-item" data-view="dashboard">Dashboard</a>
      <a class="nav-item" data-view="alarms">Active Alarms</a>
      <a class="nav-item" data-view="topology">Network Topology</a>
      
      <div class="nav-group-title">Operations</div>
      <a class="nav-item" data-view="tickets">Incident Tickets</a>
      <a class="nav-item" data-view="fm">FM Optimization</a>
      <a class="nav-item" data-view="workorders">Work Orders</a>
      <a class="nav-item" data-view="emails">Dispatcher Emails</a>
      
      <div class="nav-group-title">Management</div>
      <a class="nav-item" data-view="kpi">KPI &amp; Performance</a>
      <a class="nav-item" data-view="manual">Knowledge Base</a>
      <a class="nav-item" data-view="scenarios">Training Scenarios</a>
      <a class="nav-item" data-view="activity">Activity Log</a>
      <a class="nav-item" data-view="settings">Settings</a>
    </div>
  </div>

  <div id="main-wrap">
    <header>
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="globalSearchInput" placeholder="Search devices, tickets, alarms...">
      </div>
      <div class="user-pill">
        <div class="avatar">TE</div>
        <span>Trainee Engineer</span>
      </div>
    </header>
    <div id="content"></div>
  </div>

<script src="./js/script.js"></script>
</body>
</html>
