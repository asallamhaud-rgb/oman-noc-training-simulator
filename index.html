<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oman NOC & Service Desk Operations Simulator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            noc: {
              50: '#fdf2f8',
              100: '#fce7f3',
              200: '#fbcfe8',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
              800: '#9d174d',
              900: '#831843',
            }
          }
        }
      }
    }
  </script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-pink-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SEVERITY UTILS & STYLES ---
    const SEVERITY_CONFIG = {
      Emergency: { bg: 'bg-rose-600', text: 'text-white', badge: 'bg-rose-100 text-rose-800 border-rose-300', icon: 'fa-triangle-exclamation' },
      Critical: { bg: 'bg-red-500', text: 'text-white', badge: 'bg-red-100 text-red-800 border-red-300', icon: 'fa-circle-exclamation' },
      Major: { bg: 'bg-amber-500', text: 'text-white', badge: 'bg-amber-100 text-amber-800 border-amber-300', icon: 'fa-triangle-exclamation' },
      Minor: { bg: 'bg-sky-500', text: 'text-white', badge: 'bg-sky-100 text-sky-800 border-sky-300', icon: 'fa-info-circle' },
      Warning: { bg: 'bg-yellow-400', text: 'text-slate-900', badge: 'bg-yellow-100 text-yellow-800 border-yellow-300', icon: 'fa-bell' }
    };

    // --- INITIAL DATA SEED ---
    const SEED_NODES = [
      { id: 'MUS-RTR-021', name: 'Muscat Core Router 01', type: 'Core Router', site: 'Muscat HQ', ip: '10.20.1.21', department: 'IP Core', status: 'Operational', x: 300, y: 100, interfaces: [{ name: 'GE0/0/12', vlan: 120, status: 'UP' }, { name: 'Hu0/1/0/1', vlan: 100, status: 'UP' }] },
      { id: 'SAL-CR-001', name: 'Salalah Gateway Switch', type: 'Aggregation Switch', site: 'Salalah Port', ip: '10.20.2.14', department: 'Transmission', status: 'Critical', x: 220, y: 380, interfaces: [{ name: 'Opt0/1/2', vlan: 300, status: 'DOWN' }] },
      { id: 'SOH-SW-012', name: 'Sohar Industrial Switch', type: 'Access Switch', site: 'Sohar Freezone', ip: '10.20.3.50', department: 'Transport', status: 'Major', x: 140, y: 160, interfaces: [{ name: 'Gi1/0/25', vlan: 120, status: 'LOOP_DETECTED' }] },
      { id: 'NZW-AGG-03', name: 'Nizwa Regional Gateway', type: 'Aggregation Router', site: 'Nizwa City', ip: '10.20.4.11', department: 'Fiber', status: 'Warning', x: 380, y: 220, interfaces: [{ name: 'Gi0/0/1', vlan: 200, status: 'HIGH_LATENCY' }] },
      { id: 'SUR-VSAT-08', name: 'Sur Maritime Gateway', type: 'VSAT Hub', site: 'Sur Terminal', ip: '10.20.5.88', department: 'VSAT', status: 'Operational', x: 480, y: 280, interfaces: [{ name: 'Sat0/1', vlan: 500, status: 'UP' }] }
    ];

    const SEED_ALARMS = [
      { id: 'ALM-00421', timestamp: '14:05:12', device: 'SAL-CR-001', site: 'Salalah Port', service: 'Mobile Backhaul', department: 'Transmission', type: 'Interface Down', severity: 'Emergency', description: 'DWDM Primary Fiber Cut at Km 142 (Adam-Salalah Corridor)', status: 'Active', interface: 'Opt0/1/2' },
      { id: 'ALM-00422', timestamp: '14:06:40', device: 'SOH-SW-012', site: 'Sohar Freezone', service: 'Enterprise Data', department: 'IP Core', type: 'Spanning Tree Loop', severity: 'Critical', description: 'BPDU Flapping detected on Access VLAN 120', status: 'Active', interface: 'Gi1/0/25' },
      { id: 'ALM-00423', timestamp: '14:08:15', device: 'NZW-AGG-03', site: 'Nizwa City', service: '4G LTE Services', department: 'Fiber', type: 'High Packet Loss', severity: 'Major', description: 'Optical Attenuation exceeding -28dBm threshold', status: 'Active', interface: 'Gi0/0/1' }
    ];

    const SEED_TICKETS = [
      { id: 'INC-00521', title: 'Salalah DWDM Backbone Fiber Disruption', severity: 'Emergency', priority: 'P1', status: 'New', sourceAlarm: 'ALM-00421', device: 'SAL-CR-001', site: 'Salalah Port', service: 'Mobile Backhaul', department: 'Transmission', assignedTo: 'Unassigned', createdTime: '14:05:12', slaSeconds: 300, description: 'Complete physical fiber severance detected on main Salalah route. Saturated secondary microwave link acting as failover.' },
      { id: 'INC-00522', title: 'Sohar Industrial VLAN 120 Broadcast Storm', severity: 'Critical', priority: 'P2', status: 'In Progress', sourceAlarm: 'ALM-00422', device: 'SOH-SW-012', site: 'Sohar Freezone', service: 'Enterprise Data', department: 'IP Core', assignedTo: 'Trainee User', createdTime: '14:06:40', slaSeconds: 850, description: 'Loop causing 95% CPU utilization on access node. Switch requiring interface shutdown or STP BPDU guard activation.' }
    ];

    const SEED_EMAILS = [
      { id: 'EML-901', from: 'Transport Operations <ops@telecom.om>', subject: 'URGENT: Salalah Terrestrial Cut Escalation', date: '14:07', read: false, starred: true, body: 'Please acknowledge INC-00521 immediately. Secondary backhaul bandwidth is degraded to 30%. Requesting immediate dispatch of OTDR splicing unit.' },
      { id: 'EML-902', from: 'NOC Lead <lead@telecom.om>', subject: 'Daily Shift Briefing - Weather Warning (Dhofar)', date: '13:30', read: true, starred: false, body: 'High monsoon winds reported in Dhofar region. VSAT alignment and microwave links may experience transient fade.' }
    ];

    const SEED_ENGINEERS = [
      { id: 'ENG-014', name: 'Salim Al-Harthy', skills: ['Fiber Splicing', 'OTDR Trace'], location: 'Nizwa Base', status: 'Available', workload: 20, travelMins: 18, slaScore: 98 },
      { id: 'ENG-022', name: 'Ahmed Al-Riyami', skills: ['Cisco CLI', 'VLAN Routing'], location: 'Sohar Port', status: 'Available', workload: 40, travelMins: 12, slaScore: 94 },
      { id: 'ENG-035', name: 'Tariq Al-Busaidi', skills: ['Microwave Radio', 'VSAT'], location: 'Muscat HQ', status: 'Busy', workload: 85, travelMins: 45, slaScore: 89 }
    ];

    const SEED_MANUAL = [
      { title: 'VLAN & Interface Troubleshooting CLI', category: 'Configuration', keywords: ['vlan', 'interface', 'cli', 'shutdown', 'enable'], content: 'To clear broadcast loops or manage ports:\n1. Execute `interface <name> shutdown` to isolate a looping port.\n2. Execute `vlan <id> enable` to restore down services.\n3. Execute `interface <name> enable` to clear physical down status.' },
      { title: 'Fiber Cut & OTDR Splicing SOP', category: 'Field Maintenance', keywords: ['fiber', 'dwdm', 'cut', 'splicing', 'salalah'], content: 'When a DWDM terrestrial cut occurs:\n1. Immediately acknowledge Emergency ticket within 5-Minute SLA.\n2. Open FM Optimizer tab and dispatch engineer qualified in DWDM/OTDR.\n3. Reroute core MPLS traffic via CLI using `autoroute enable`.' },
      { title: 'NOC Severity Classification Guide', category: 'Operations', keywords: ['severity', 'emergency', 'critical', 'sla'], content: 'Emergency: National outage / Core fiber cut (SLA: 5m)\nCritical: Major site disconnect / Loop storm (SLA: 15m)\nMajor: Degraded service / Redundant link loss (SLA: 30m)\nMinor: Non-critical unit error (SLA: 60m)' }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [simSpeed, setSimSpeed] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');
      
      // Core State
      const [alarms, setAlarms] = useState(SEED_ALARMS);
      const [tickets, setTickets] = useState(SEED_TICKETS);
      const [nodes, setNodes] = useState(SEED_NODES);
      const [emails, setEmails] = useState(SEED_EMAILS);
      const [engineers, setEngineers] = useState(SEED_ENGINEERS);
      const [workOrders, setWorkOrders] = useState([]);
      const [activityLogs, setActivityLogs] = useState([
        { time: '14:05:12', text: 'Emergency Alarm ALM-00421 raised by SAL-CR-001' },
        { time: '14:05:12', text: 'Auto-Incident INC-00521 created with 5-Minute SLA' }
      ]);

      // Selection States
      const [selectedTicket, setSelectedTicket] = useState(SEED_TICKETS[0]);
      const [selectedNode, setSelectedNode] = useState(SEED_NODES[0]);
      const [selectedEmail, setSelectedEmail] = useState(SEED_EMAILS[0]);
      const [emailReplyText, setEmailReplyText] = useState('');
      
      // Manual & Search Overlays
      const [manualOpen, setManualOpen] = useState(false);
      const [manualFilter, setManualFilter] = useState('');
      
      // CLI State
      const [cliLogs, setCliLogs] = useState(['OMAN TELECOM BACKBONE OS v8.4', 'Type "help" or run configuration commands...']);
      const [cliInput, setCliInput] = useState('');

      // Training Metrics & SLA Engine
      const [fiveMinTimer, setFiveMinTimer] = useState(300);
      const [scoreMetrics, setScoreMetrics] = useState({ slaCompliance: 96, incidentHandling: 92, troubleshooting: 88, overall: 92 });

      // Dynamic SLA Countdown Effect
      useEffect(() => {
        const interval = setInterval(() => {
          setFiveMinTimer(prev => Math.max(0, prev - 1 * simSpeed));
          setTickets(prev => prev.map(t => ({
            ...t,
            slaSeconds: t.status === 'Resolved' ? t.slaSeconds : Math.max(0, t.slaSeconds - 1 * simSpeed)
          })));
        }, 1000);
        return () => clearInterval(interval);
      }, [simSpeed]);

      // Logging Helper
      const addLog = (text) => {
        const now = new Date().toTimeString().split(' ')[0];
        setActivityLogs(prev => [{ time: now, text }, ...prev]);
      };

      // --- INTERCONNECTED ACTION HANDLERS ---
      
      // 1. Acknowledge Ticket
      const handleAcknowledgeTicket = (ticketId) => {
        setTickets(prev => prev.map(t => t.id === ticketId ? { ...t, status: 'In Progress', assignedTo: 'Trainee User' } : t));
        addLog(`Ticket ${ticketId} acknowledged by Trainee.`);
      };

      // 2. Resolve Ticket & Clear Network State
      const handleResolveTicket = (ticketId) => {
        const ticket = tickets.find(t => t.id === ticketId);
        if (!ticket) return;

        setTickets(prev => prev.map(t => t.id === ticketId ? { ...t, status: 'Resolved' } : t));
        setAlarms(prev => prev.map(a => a.device === ticket.device ? { ...a, status: 'Cleared' } : a));
        setNodes(prev => prev.map(n => n.id === ticket.device ? { ...n, status: 'Operational' } : n));
        
        addLog(`Incident ${ticketId} resolved. Associated device ${ticket.device} restored to Operational.`);
      };

      // 3. Dispatch Engineer & Create Work Order
      const handleDispatchEngineer = (eng) => {
        if (!selectedTicket) return;
        const newWO = {
          id: `WO-${Math.floor(1000 + Math.random() * 9000)}`,
          ticketId: selectedTicket.id,
          site: selectedTicket.site,
          engineer: eng.name,
          status: 'Dispatched',
          eta: `${eng.travelMins} mins`
        };
        setWorkOrders(prev => [newWO, ...prev]);
        setEngineers(prev => prev.map(e => e.name === eng.name ? { ...e, status: 'On Site' } : e));
        addLog(`Work Order ${newWO.id} created. Assigned ${eng.name} to ${selectedTicket.site}.`);
      };

      // 4. Interactive CLI Command Engine
      const handleCliSubmit = (e) => {
        e.preventDefault();
        if (!cliInput.trim()) return;
        const cmd = cliInput.trim().toLowerCase();
        const logs = [...cliLogs, `OMAN-NOC-CLI# ${cliInput}`];

        if (cmd.includes('interface') && cmd.includes('shutdown')) {
          logs.push('✓ Interface Gi1/0/25 administratively disabled. Spanning tree loop cleared on SOH-SW-012.');
          setAlarms(prev => prev.map(a => a.device === 'SOH-SW-012' ? { ...a, status: 'Cleared' } : a));
          setNodes(prev => prev.map(n => n.id === 'SOH-SW-012' ? { ...n, status: 'Operational' } : n));
          setTickets(prev => prev.map(t => t.device === 'SOH-SW-012' ? { ...t, status: 'Resolved' } : t));
          addLog('CLI Action: Isolated flapping loop on SOH-SW-012. Incident INC-00522 cleared.');
        } else if (cmd.includes('autoroute') || cmd.includes('enable')) {
          logs.push('✓ MPLS secondary route engaged. Traffic rerouted away from Salalah cut corridor.');
          addLog('CLI Action: Rerouted core MPLS traffic via secondary subsea ring.');
        } else if (cmd === 'help') {
          logs.push('Available Commands: interface <name> shutdown | vlan <id> enable | autoroute enable | show status');
        } else {
          logs.push(`Executed: ${cliInput} - Parameter updated.`);
        }

        setCliLogs(logs);
        setCliInput('');
      };

      // 5. Send Email Reply
      const handleSendEmailReply = () => {
        if (!emailReplyText.trim() || !selectedEmail) return;
        const sentMsg = {
          id: `EML-OUT-${Math.floor(1000 + Math.random() * 9000)}`,
          from: 'Trainee Operator <trainee@telecom.om>',
          subject: `RE: ${selectedEmail.subject}`,
          date: new Date().toTimeString().split(' ')[0].substring(0, 5),
          read: true,
          starred: false,
          body: emailReplyText
        };
        setEmails(prev => [sentMsg, ...prev]);
        setEmailReplyText('');
        addLog(`Sent official NOC response email regarding "${selectedEmail.subject}"`);
      };

      // --- FILTERED SEARCH ENGINE ---
      const searchResults = useMemo(() => {
        if (!searchQuery.trim()) return null;
        const q = searchQuery.toLowerCase();
        return {
          tickets: tickets.filter(t => t.id.toLowerCase().includes(q) || t.title.toLowerCase().includes(q) || t.device.toLowerCase().includes(q)),
          alarms: alarms.filter(a => a.id.toLowerCase().includes(q) || a.description.toLowerCase().includes(q) || a.device.toLowerCase().includes(q)),
          nodes: nodes.filter(n => n.id.toLowerCase().includes(q) || n.name.toLowerCase().includes(q) || n.ip.includes(q))
        };
      }, [searchQuery, tickets, alarms, nodes]);

      const formatTimer = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div className="flex h-screen overflow-hidden bg-slate-100">

          {/* LEFT SIDE NAVIGATION MENU */}
          <aside className="w-64 bg-white border-r border-slate-200 flex flex-col z-20 shrink-0">
            <div className="p-5 border-b border-slate-100 flex items-center gap-3 bg-pink-50/50">
              <div className="w-10 h-10 rounded-xl bg-pink-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-pink-200">
                N
              </div>
              <div>
                <h1 className="font-bold text-slate-900 leading-none">OMAN NOC</h1>
                <span className="text-[10px] uppercase font-semibold text-pink-600 tracking-wider">Simulator v4.2</span>
              </div>
            </div>

            <nav className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                { id: 'alarms', label: 'Alarms Stream', icon: 'fa-bell', count: alarms.filter(a=>a.status==='Active').length },
                { id: 'tickets', label: 'Tickets / SMA', icon: 'fa-ticket', count: tickets.filter(t=>t.status!=='Resolved').length },
                { id: 'topology', label: 'Physical Topology', icon: 'fa-network-wired' },
                { id: 'emails', label: 'NOC Email Suite', icon: 'fa-envelope', count: emails.filter(e=>!e.read).length },
                { id: 'fm', label: 'FM Optimizer', icon: 'fa-user-gear' },
                { id: 'cli', label: 'CLI / Config Terminal', icon: 'fa-terminal' },
                { id: 'scenarios', label: 'Training Scenarios', icon: 'fa-graduation-cap' },
                { id: 'kpi', label: 'KPI & Performance', icon: 'fa-award' },
                { id: 'sli', label: 'SLI / Configuration', icon: 'fa-sliders' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    activeTab === item.id 
                      ? 'bg-pink-600 text-white shadow-sm shadow-pink-200' 
                      : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'
                  }`}
                >
                  <div className="flex items-center gap-3">
                    <i className={`fa-solid ${item.icon} text-sm w-4`}></i>
                    <span>{item.label}</span>
                  </div>
                  {item.count > 0 && (
                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${activeTab === item.id ? 'bg-white/20 text-white' : 'bg-pink-100 text-pink-700'}`}>
                      {item.count}
                    </span>
                  )}
                </button>
              ))}
            </nav>

            {/* SIMULATION SPEED CONTROLLER */}
            <div className="p-4 border-t border-slate-100 bg-slate-50/80 space-y-2">
              <div className="flex items-center justify-between text-[11px] font-semibold text-slate-500 uppercase">
                <span>Sim Speed</span>
                <span className="text-pink-600">{simSpeed}x</span>
              </div>
              <div className="flex gap-1">
                {[1, 2, 5, 10].map(s => (
                  <button
                    key={s}
                    onClick={() => setSimSpeed(s)}
                    className={`flex-1 py-1 rounded text-xs font-bold border transition ${
                      simSpeed === s ? 'bg-pink-600 text-white border-pink-600' : 'bg-white text-slate-600 border-slate-200'
                    }`}
                  >
                    {s}x
                  </button>
                ))}
              </div>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col overflow-hidden">
            
            {/* TOP HEADER & GLOBAL SEARCH BAR */}
            <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between z-10 shrink-0">
              <div className="flex items-center gap-4 flex-1 max-w-xl">
                <div className="relative w-full">
                  <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                  <input
                    type="text"
                    placeholder="Global Search across Devices, Alarms, Tickets, IPs (e.g. MUS-RTR-021, INC-00521)..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs focus:outline-none focus:border-pink-500 focus:bg-white transition"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  )}
                </div>
              </div>

              <div className="flex items-center gap-4">
                {/* 5-MINUTE SLA RESPONSE TIMER BANNER */}
                <div className="flex items-center gap-3 bg-rose-50 border border-rose-200 px-3.5 py-1.5 rounded-xl">
                  <i className="fa-solid fa-stopwatch text-rose-600 animate-pulse text-sm"></i>
                  <div>
                    <div className="text-[9px] uppercase font-bold text-rose-500">5-Min SLA Response Challenge</div>
                    <div className="font-mono text-sm font-bold text-rose-700 leading-none">{formatTimer(fiveMinTimer)}</div>
                  </div>
                </div>

                <button
                  onClick={() => setManualOpen(true)}
                  className="flex items-center gap-2 bg-pink-50 hover:bg-pink-100 text-pink-700 border border-pink-200 px-3.5 py-2 rounded-xl text-xs font-semibold transition"
                >
                  <i className="fa-solid fa-book-open"></i>
                  <span>NOC Manual</span>
                </button>
              </div>
            </header>

            {/* OVERLAY GLOBAL SEARCH RESULTS PANEL */}
            {searchResults && (
              <div className="absolute top-16 left-64 right-0 bg-white border-b border-slate-200 shadow-xl p-6 z-30 max-h-[70vh] overflow-y-auto space-y-4">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-slate-900">Search Results for "{searchQuery}"</h3>
                  <button onClick={() => setSearchQuery('')} className="text-xs text-slate-500 hover:text-slate-800">Close Search</button>
                </div>
                
                <div className="grid grid-cols-3 gap-6">
                  <div>
                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Tickets ({searchResults.tickets.length})</h4>
                    {searchResults.tickets.map(t => (
                      <div key={t.id} onClick={() => { setSelectedTicket(t); setActiveTab('tickets'); setSearchQuery(''); }} className="p-2.5 bg-slate-50 hover:bg-pink-50 rounded-lg cursor-pointer border mb-1.5">
                        <div className="font-bold text-xs text-slate-800">{t.id}: {t.title}</div>
                        <div className="text-[10px] text-slate-500">{t.device} • {t.status}</div>
                      </div>
                    ))}
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Alarms ({searchResults.alarms.length})</h4>
                    {searchResults.alarms.map(a => (
                      <div key={a.id} onClick={() => { setActiveTab('alarms'); setSearchQuery(''); }} className="p-2.5 bg-slate-50 hover:bg-pink-50 rounded-lg cursor-pointer border mb-1.5">
                        <div className="font-bold text-xs text-slate-800">{a.id}: {a.type}</div>
                        <div className="text-[10px] text-slate-500">{a.device} • {a.severity}</div>
                      </div>
                    ))}
                  </div>
                  <div>
                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">Devices ({searchResults.nodes.length})</h4>
                    {searchResults.nodes.map(n => (
                      <div key={n.id} onClick={() => { setSelectedNode(n); setActiveTab('topology'); setSearchQuery(''); }} className="p-2.5 bg-slate-50 hover:bg-pink-50 rounded-lg cursor-pointer border mb-1.5">
                        <div className="font-bold text-xs text-slate-800">{n.id} ({n.name})</div>
                        <div className="text-[10px] text-slate-500">IP: {n.ip} • Status: {n.status}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB CONTENT BODY */}
            <main className="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-6">

              {/* DASHBOARD TAB */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  
                  {/* SEVERITY BREAKDOWN KPI CARDS */}

              {/* CLI TERMINAL TAB */}
              {activeTab === 'cli' && (
                <div className="bg-slate-950 rounded-2xl p-6 font-mono text-xs text-emerald-400 border border-slate-800 shadow-2xl space-y-4">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-3 text-slate-400 text-[11px]">
                    <span>OMAN TELECOM BACKBONE CLI - SESSION ACTIVE</span>
                    <span>PORT: TTY/01</span>
                  </div>

                  <div className="h-72 overflow-y-auto custom-scrollbar space-y-1">
                    {cliLogs.map((l, i) => (
                      <div key={i}>{l}</div>
                    ))}
                  </div>

                  <form onSubmit={handleCliSubmit} className="flex gap-2 border-t border-slate-800 pt-3">
                    <span className="text-slate-400 font-bold">OMAN-NOC-CLI#</span>
                    <input
                      type="text"
                      value={cliInput}
                      onChange={e => setCliInput(e.target.value)}
                      placeholder="Try 'interface Gi1/0/25 shutdown' or 'vlan 120 enable'..."
                      className="flex-1 bg-transparent text-emerald-300 outline-none font-mono text-xs"
                    />
                    <button type="submit" className="bg-emerald-600 text-slate-950 px-4 py-1 rounded font-bold text-xs hover:bg-emerald-500">
                      Execute
                    </button>
                  </form>
                </div>
              )}

              {/* SCENARIOS TAB */}
              {activeTab === 'scenarios' && (
                <div className="grid grid-cols-2 gap-6">
                  {[
                    { title: 'Scenario 1: Adam Corridor Fiber Severance', diff: 'Expert', desc: 'Main DWDM link severed. Trainee must acknowledge Emergency under 5 mins, execute CLI reroute, and dispatch OTDR engineer.' },
                    { title: 'Scenario 2: Sohar Access Loop Storm', diff: 'Intermediate', desc: 'Spanning tree loop degrading enterprise access node. Trainee must shut down flapping interface Gi1/0/25 in CLI.' }
                  ].map((s, idx) => (
                    <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                      <span className="px-2 py-0.5 rounded bg-pink-100 text-pink-700 font-bold text-[10px]">{s.diff}</span>
                      <h3 className="font-bold text-slate-900 text-base">{s.title}</h3>
                      <p className="text-xs text-slate-600 leading-relaxed">{s.desc}</p>
                      <button onClick={() => { setActiveTab('dashboard'); addLog(`Started training scenario: ${s.title}`); }} className="bg-pink-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-pink-700">
                        Launch Scenario
                      </button>
                    </div>
                  ))}
                </div>
              )}

              {/* KPI TAB */}
              {activeTab === 'kpi' && (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                  <h2 className="text-lg font-bold text-slate-900">Trainee Operational Performance Index</h2>
                  <div className="grid grid-cols-4 gap-4">
                    <div className="bg-pink-50 p-4 rounded-xl text-center border border-pink-200">
                      <div className="text-3xl font-bold text-pink-600">{scoreMetrics.overall}%</div>
                      <div className="text-xs text-slate-600 font-semibold mt-1">Overall Score</div>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-xl text-center border">
                      <div className="text-3xl font-bold text-slate-800">{scoreMetrics.slaCompliance}%</div>
                      <div className="text-xs text-slate-600 font-semibold mt-1">SLA Compliance</div>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-xl text-center border">
                      <div className="text-3xl font-bold text-slate-800">{scoreMetrics.incidentHandling}%</div>
                      <div className="text-xs text-slate-600 font-semibold mt-1">Incident Handling</div>
                    </div>
                    <div className="bg-slate-50 p-4 rounded-xl text-center border">
                      <div className="text-3xl font-bold text-slate-800">{scoreMetrics.troubleshooting}%</div>
                      <div className="text-xs text-slate-600 font-semibold mt-1">Troubleshooting</div>
                    </div>
                  </div>
                </div>
              )}

              {/* SLI / CONFIGURATION TAB */}
              {activeTab === 'sli' && (
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                  <h2 className="text-lg font-bold text-slate-900">Simulator System Parameters</h2>
                  <div className="space-y-3 text-xs max-w-md">
                    <div>
                      <label className="block text-slate-500 mb-1">Emergency SLA Target (Seconds)</label>
                      <input type="number" defaultValue={300} className="w-full border p-2 rounded-xl" />
                    </div>
                    <div>
                      <label className="block text-slate-500 mb-1">Critical SLA Target (Seconds)</label>
                      <input type="number" defaultValue={900} className="w-full border p-2 rounded-xl" />
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* SIDE MANUAL MODAL */}
          {manualOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-white h-full p-6 space-y-4 overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-base">NOC Operations Knowledge Base</h3>
                  <button onClick={() => setManualOpen(false)} className="text-slate-400 hover:text-slate-700">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <input
                  type="text"
                  placeholder="Search guides (vlan, fiber cut, severity)..."
                  value={manualFilter}
                  onChange={e => setManualFilter(e.target.value)}
                  className="w-full bg-slate-50 border p-2.5 rounded-xl text-xs focus:outline-none focus:border-pink-500"
                />

                <div className="space-y-4">
                  {SEED_MANUAL.filter(m => !manualFilter || m.keywords.some(k => k.includes(manualFilter.toLowerCase()))).map((m, i) => (
                    <div key={i} className="p-4 bg-slate-50 rounded-xl border space-y-2">
                      <span className="px-2 py-0.5 bg-pink-100 text-pink-700 rounded text-[9px] font-bold">{m.category}</span>
                      <h4 className="font-bold text-xs text-slate-900">{m.title}</h4>
                      <p className="text-xs text-slate-600 whitespace-pre-line leading-relaxed">{m.content}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
