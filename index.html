<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measured — Health & Wellness Wearable</title>
    
    <!-- Google Fonts: Inter & Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Instrument Serif', 'serif'],
                        helvetica: ['Helvetica Neue Roman', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        @font-face {
            font-family: 'Helvetica Neue Roman';
            src: url('/public/fonts/HelveticaNeueRoman.woff2') format('woff2'),
                 url('/public/fonts/HelveticaNeueRoman.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        .font-helvetica-neue {
            font-family: 'Helvetica Neue Roman', 'Inter', sans-serif;
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mobile-nav-item {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.77, 0, 0.18, 1) forwards;
        }

        body.menu-open {
            overflow: hidden;
        }
    </style>
</head>
<body class="h-full overflow-hidden bg-white selection:bg-neutral-800 selection:text-white">

    <!-- NAVIGATION (z-50, fixed) -->
    <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-6 py-5 md:px-12">
        <!-- Logo -->
        <a href="#" class="flex items-center gap-3 text-white focus:outline-none">
            <svg class="w-7 h-7" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 96 95 L 63.5 128 L 64 128 L 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 64 L 64 0 L 192 0 Z M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z"/>
            </svg>
        </a>

        <!-- Desktop Center Pill Nav -->
        <nav class="hidden md:flex items-center gap-1 px-3 py-1.5 rounded-full liquid-glass">
            <a href="#device" class="px-4 py-1.5 text-sm font-medium text-white/70 hover:text-white transition-colors rounded-full">Device</a>
            <a href="#stories" class="px-4 py-1.5 text-sm font-medium text-white/70 hover:text-white transition-colors rounded-full">Real Stories</a>
            <a href="#science" class="px-4 py-1.5 text-sm font-medium text-white/70 hover:text-white transition-colors rounded-full">Science</a>
            <a href="#plans" class="px-4 py-1.5 text-sm font-medium text-white/70 hover:text-white transition-colors rounded-full">Plans</a>
            <a href="#contact" class="px-4 py-1.5 text-sm font-medium text-white/70 hover:text-white transition-colors rounded-full">Reach Us</a>
        </nav>

        <!-- Desktop CTA -->
        <div class="hidden md:flex items-center">
            <button class="flex items-center gap-2 px-5 py-2 rounded-full liquid-glass text-white text-sm font-medium hover:bg-white/10 transition-all">
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                Reserve Yours
            </button>
        </div>

        <!-- Mobile Hamburger -->
        <button id="menuToggle" class="md:hidden flex flex-col justify-center items-center w-10 h-10 rounded-full liquid-glass focus:outline-none" aria-label="Toggle menu">
            <div class="w-5 h-[1.5px] bg-white mb-1 transition-all"></div>
            <div class="w-3.5 h-[1.5px] bg-white transition-all"></div>
        </button>
    </header>

    <!-- MOBILE FULLSCREEN MENU (z-55) -->
    <div id="mobileMenu" class="fixed inset-0 z-55 bg-[#0a0a0a] flex flex-col justify-between px-8 py-12 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="flex items-center justify-between">
            <svg class="w-7 h-7 text-white" viewBox="0 0 256 256" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 96 95 L 63.5 128 L 64 128 L 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 64 L 64 0 L 192 0 Z M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z"/>
            </svg>
            <button id="menuClose" class="w-10 h-10 rounded-full liquid-glass flex items-center justify-center text-white focus:outline-none transform transition-transform duration-300 hover:rotate-90">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <nav class="flex flex-col gap-6 my-auto text-left">
            <a href="#device" class="mobile-nav-item text-3xl sm:text-4xl font-medium text-white/90 hover:text-white transition-colors" style="animation-delay: 100ms;">Device</a>
            <a href="#stories" class="mobile-nav-item text-3xl sm:text-4xl font-medium text-white/90 hover:text-white transition-colors" style="animation-delay: 160ms;">Real Stories</a>
            <a href="#science" class="mobile-nav-item text-3xl sm:text-4xl font-medium text-white/90 hover:text-white transition-colors" style="animation-delay: 220ms;">Science</a>
            <a href="#plans" class="mobile-nav-item text-3xl sm:text-4xl font-medium text-white/90 hover:text-white transition-colors" style="animation-delay: 280ms;">Plans</a>
            <a href="#contact" class="mobile-nav-item text-3xl sm:text-4xl font-medium text-white/90 hover:text-white transition-colors" style="animation-delay: 340ms;">Reach Us</a>
        </nav>

        <div class="mobile-nav-item" style="animation-delay: 400ms;">
            <button class="w-full flex items-center justify-center gap-2 py-4 rounded-full liquid-glass text-white font-medium">
                <span class="w-2 h-2 rounded-full bg-green-400"></span>
                Reserve Yours
            </button>
        </div>
    </div>

    <!-- HERO SECTION (100vh, overflow hidden) -->
    <section id="hero" class="font-helvetica-neue relative w-full h-screen overflow-hidden bg-neutral-950 select-none">
        
        <!-- Layer 1 — Grid Background (z-0, opacity 0.1) -->
        <div id="gridBackground" class="absolute inset-0 z-0 opacity-10 pointer-events-none transition-transform duration-75 ease-out">
            <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
                        <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" stroke-width="0.6"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#gridPattern)" />
            </svg>
        </div>

        <!-- Layer 2 — Background Image (z-10) -->
        <div class="absolute inset-0 z-10 bg-center bg-cover bg-no-repeat" style="background-image: url('https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260713_140344_79e1296a-86d7-43fd-9b5f-63ffe560f291.png&w=1280&q=85');"></div>

        <!-- Layer 3 — Hero Text (z-20) -->
        <div class="absolute inset-x-0 top-20 sm:top-28 md:top-32 z-20 flex justify-center pointer-events-none">
            <h1 class="font-serif text-[4.5rem] xs:text-[5.5rem] sm:text-[10rem] md:text-[13rem] lg:text-[16rem] leading-[0.9] text-white tracking-tight text-center">
                Measured
            </h1>
        </div>

        <!-- Layer 4 — Overlay Image (z-25) -->
        <img src="https://soft-zoom-63098134.figma.site/_assets/v11/3f10f1876e118f72a396e05a6c2d099569478272.png" alt="" class="absolute inset-0 w-full h-full object-cover z-25 pointer-events-none" />

        <!-- Layer 5 — Spotlight Reveal (z-30) -->
        <div id="spotlightContainer" class="absolute inset-0 z-30 pointer-events-none" style="clip-path: inset(40% 0 0 0);">
            <video id="frontVideo" class="absolute inset-0 w-full h-full object-cover" autoplay loop muted playsinline>
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_162101_0d7498c5-29bb-47bf-a99f-2773c0a880a9.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Hidden Canvas for Mask Generation -->
        <canvas id="maskCanvas" class="hidden"></canvas>
    </section>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const menuClose = document.getElementById('menuClose');
        const mobileMenu = document.getElementById('mobileMenu');

        function toggleMenu(open) {
            if (open) {
                document.body.classList.add('menu-open');
                mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                document.body.classList.remove('menu-open');
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        menuToggle.addEventListener('click', () => toggleMenu(true));
        menuClose.addEventListener('click', () => toggleMenu(false));
        mobileMenu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => toggleMenu(false));
        });

        const heroSection = document.getElementById('hero');
        const gridBg = document.getElementById('gridBackground');
        const spotlightContainer = document.getElementById('spotlightContainer');
        const canvas = document.getElementById('maskCanvas');
        const ctx = canvas.getContext('2d');

        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        window.addEventListener('resize', () => {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        });

        let targetX = width / 2;
        let targetY = height / 2;
        let currentX = width / 2;
        let currentY = height / 2;
        let mouseInside = false;

        heroSection.addEventListener('mousemove', (e) => {
            mouseInside = true;
            targetX = e.clientX;
            targetY = e.clientY;
        });

        heroSection.addEventListener('mouseleave', () => {
            mouseInside = false;
            targetX = width / 2;
            targetY = height + 300;
        });

        const radius = 260;

        function updateMask(x, y) {
            ctx.clearRect(0, 0, width, height);

            if (!mouseInside) {
                spotlightContainer.style.webkitMaskImage = 'none';
                spotlightContainer.style.maskImage = 'none';
                return;
            }

            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.75, 'rgba(255, 255, 255, 0.4)');
            gradient.addColorStop(0.88, 'rgba(255, 255, 255, 0.12)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            const dataURL = canvas.toDataURL();
            spotlightContainer.style.webkitMaskImage = `url(${dataURL})`;
            spotlightContainer.style.maskImage = `url(${dataURL})`;
            spotlightContainer.style.webkitMaskRepeat = 'no-repeat';
            spotlightContainer.style.maskRepeat = 'no-repeat';
        }

        function animate() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;

            updateMask(currentX, currentY);

            if (mouseInside) {
                const centerX = width / 2;
                const centerY = height / 2;
                const offsetX = ((currentX - centerX) / centerX) * 16;
                const offsetY = ((currentY - centerY) / centerY) * 16;
                gridBg.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
